<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IC 解構室 · 顯示驅動 IC</title>
<meta name="description" content="一個像素如何亮起：從零基礎看懂顯示驅動 IC 的互動教材。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='8' y='8' width='16' height='16' rx='2' fill='%23f6f1e7' stroke='%232b2620' stroke-width='2.4'/%3E%3Cpath d='M12 4v4M16 4v4M20 4v4M12 24v4M16 24v4M20 24v4M4 12h4M4 16h4M4 20h4M24 12h4M24 16h4M24 20h4' stroke='%232b2620' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./src/ui/css/app.css">
</head>
<body>
<div id="app"></div>
<div id="boot" role="status">載入中…</div>
<noscript><p style="padding:24px">這份教材需要啟用 JavaScript 才能使用。</p></noscript>
<script>
/* start-up safety net: if the app fails to load, show the reason instead of an endless "loading" */
(function () {
  function show(why) {
    var b = document.getElementById('boot'); if (!b || document.documentElement.dataset.ready) return;
    b.className = 'err'; b.textContent = '頁面啟動失敗：' + why + '（請重新整理；若仍失敗，請把這段文字回報給作者）';
  }
  addEventListener('error', function (e) { show(e.message || '未知錯誤'); });
  addEventListener('unhandledrejection', function (e) { show(String(e.reason)); });
  setTimeout(function () { show('逾時，程式沒有載入完成'); }, 10000);
})();
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
