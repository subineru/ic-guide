# Publishes the site to GitHub Pages: `main` at the root, branches proto/* and feat/* as previews under /preview/<branch>/.
# In the repository: Settings -> Pages -> Source = "GitHub Actions", and
# Settings -> Environments -> github-pages -> Deployment branches: add `proto/*` and `feat/*` next to `main`.
name: deploy
on:
  push:
    branches: [main, 'proto/**', 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # the site root is always main, whichever branch triggered this run
          fetch-depth: 0       # previews need every branch
      - run: git fetch origin '+refs/heads/proto/*:refs/remotes/origin/proto/*' '+refs/heads/feat/*:refs/remotes/origin/feat/*' || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run budget
      - run: node tools/assemble-pages.mjs site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
