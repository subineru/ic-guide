# Publishes the site to GitHub Pages: `main` at the root, branches proto/* and feat/* as previews under /preview/<branch>/.
# In the repository: Settings -> Pages -> Source = "GitHub Actions".  Nothing else to configure.
#
# The real deployment always runs on `main` (the github-pages environment only lets main deploy by default).
# A push to a proto/* or feat/* branch only asks `main` to run the deployment again (the `relay` job), and that run
# builds main plus every preview branch from scratch, so previews update and none disappears.
name: deploy
on:
  push:
    branches: [main, 'proto/**', 'feat/**']
  workflow_dispatch:
jobs:
  relay:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # previews need every branch
      - run: git fetch origin '+refs/heads/proto/*:refs/remotes/origin/proto/*' '+refs/heads/feat/*:refs/remotes/origin/feat/*' || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run budget
      - run: node tools/assemble-pages.mjs site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
